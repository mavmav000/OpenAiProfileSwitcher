name: Windows build

on:
  push:
    branches: [main, feature/opt-in-shared-codex-home]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile WinForms launcher
        shell: pwsh
        run: dotnet build .\OpenAIProfileSwitcher.csproj --configuration Release
